upstream floe_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=floe_api_ratelimit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=floe_api_conn:10m;

server {
    listen 80;
    server_name floe.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name floe.example.com;

    ssl_certificate     /etc/ssl/certs/floe.example.com.pem;
    ssl_certificate_key /etc/ssl/private/floe.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "0" always;

    # Let the app handle CORS (@fastify/cors)
    add_header Access-Control-Allow-Origin "";  # overridden by app when needed

    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;
    proxy_max_temp_file_size 0;

    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    limit_req zone=floe_api_ratelimit burst=50 nodelay;
    limit_conn zone=floe_api_conn 100;
    limit_conn_status 429;
    limit_req_status 429;

    location /health {
        access_log off;
        proxy_pass http://floe_api;
        proxy_next_upstream off;
    }

    location /livez {
        access_log off;
        proxy_pass http://floe_api;
        proxy_next_upstream off;
    }

    location /version {
        access_log off;
        proxy_pass http://floe_api;
        proxy_next_upstream off;
    }

    location /metrics {
        access_log off;
        proxy_pass http://floe_api;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://floe_api;

        proxy_set_header X-Request-Start "t=${msec}";

        # Pass through rate-limit headers from upstream
        proxy_pass_header X-RateLimit-Limit;
        proxy_pass_header X-RateLimit-Remaining;
        proxy_pass_header X-RateLimit-Reset;
    }

    access_log /var/log/nginx/floe-api-access.log;
    error_log  /var/log/nginx/floe-api-error.log;
}
